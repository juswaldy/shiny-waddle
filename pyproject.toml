[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "original-language-bible-reader"
version = "0.2.0"
description = "Sources and lexical helps to LaTeX and PDF reader editions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "src/bible_reader/resources/Ezra-LICENSE.txt", "src/bible_reader/resources/GentiumPlus-LICENSE.txt"]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "defusedxml>=0.7,<1",
  "pypdf>=5,<7",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1", "playwright>=1.49,<2", "pillow>=11,<13", "pypdfium2>=4,<6"]

[project.scripts]
bible-reader = "bible_reader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bible_reader = ["templates/*.tex", "web/templates/*.html", "web/static/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an installed TeX engine", "browser: requires Playwright Chromium"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
